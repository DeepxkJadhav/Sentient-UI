<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#1e293b" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="16" fill="url(#grid)"/>
  <rect width="900" height="240" rx="16" stroke="#1e293b" stroke-width="1.5" fill="none"/>

  <!-- Swarm Graph Decorative Constellation (Right Side) -->
  <g opacity="0.35" transform="translate(560, 20)">
    <line x1="80" y1="50" x2="180" y2="40" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="80" y1="50" x2="120" y2="130" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="180" y1="40" x2="260" y2="90" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="120" y1="130" x2="200" y2="160" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="260" y1="90" x2="200" y2="160" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="180" y1="40" x2="200" y2="160" stroke="#3b82f6" stroke-width="1.2"/>

    <!-- Nodes -->
    <circle cx="80" cy="50" r="7" fill="#0c1220" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="80" cy="50" r="3" fill="#06b6d4"/>
    
    <circle cx="180" cy="40" r="9" fill="#0c1220" stroke="#818cf8" stroke-width="2.5"/>
    <circle cx="180" cy="40" r="4" fill="#818cf8"/>
    
    <circle cx="120" cy="130" r="6" fill="#0c1220" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="120" cy="130" r="2.5" fill="#3b82f6"/>
    
    <circle cx="260" cy="90" r="8" fill="#0c1220" stroke="#10b981" stroke-width="2"/>
    <circle cx="260" cy="90" r="3.5" fill="#10b981"/>
    
    <circle cx="200" cy="160" r="6" fill="#0c1220" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="200" cy="160" r="2.5" fill="#06b6d4"/>
  </g>

  <!-- Left Side: Emblem + Typography -->
  <g transform="translate(48, 44)">
    <!-- Logo Icon -->
    <g transform="translate(0, 0)">
      <rect width="48" height="48" rx="12" fill="#0c1424" stroke="#1e293b" stroke-width="1.5"/>
      <path d="M24 10 L35 17 L35 31 L24 38 L13 31 L13 17 Z" stroke="#06b6d4" stroke-width="2" fill="none"/>
      <circle cx="24" cy="24" r="4" fill="#38bdf8"/>
      <line x1="24" y1="10" x2="24" y2="20" stroke="#06b6d4" stroke-width="1.5"/>
      <line x1="24" y1="28" x2="24" y2="38" stroke="#06b6d4" stroke-width="1.5"/>
      <line x1="13" y1="24" x2="20" y2="24" stroke="#06b6d4" stroke-width="1.5"/>
      <line x1="28" y1="24" x2="35" y2="24" stroke="#06b6d4" stroke-width="1.5"/>
    </g>

    <!-- Header Text -->
    <text x="64" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
      SENTIENT<tspan fill="#38bdf8">-UI</tspan>
    </text>
    
    <!-- Version Tag -->
    <rect x="254" y="11" width="62" height="20" rx="10" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
    <text x="285" y="24" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">v1.0.0</text>

    <!-- Subtitle -->
    <text x="64" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Swarm orchestration and neural execution control plane for autonomous coding teams
    </text>

    <!-- Status Chips -->
    <g transform="translate(0, 92)">
      <!-- Chip 1: Topologies -->
      <g transform="translate(0, 0)">
        <rect width="138" height="28" rx="6" fill="#0e1726" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#38bdf8"/>
        <text x="24" y="18" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#cbd5e1">4 Topologies</text>
      </g>
      
      <!-- Chip 2: GOAP Solver -->
      <g transform="translate(148, 0)">
        <rect width="138" height="28" rx="6" fill="#0e1726" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#818cf8"/>
        <text x="24" y="18" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#cbd5e1">A* GOAP Planner</text>
      </g>
      
      <!-- Chip 3: Byzantine Quorum -->
      <g transform="translate(296, 0)">
        <rect width="158" height="28" rx="6" fill="#0e1726" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#10b981"/>
        <text x="24" y="18" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#cbd5e1">Byzantine Consensus</text>
      </g>

      <!-- Chip 4: MCP Tools -->
      <g transform="translate(464, 0)">
        <rect width="138" height="28" rx="6" fill="#0e1726" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#f59e0b"/>
        <text x="24" y="18" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#cbd5e1">314+ MCP Tools</text>
      </g>
    </g>
  </g>
</svg>
