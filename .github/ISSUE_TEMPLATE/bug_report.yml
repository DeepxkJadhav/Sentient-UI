name: Bug report
description: File a bug report for Sentient-UI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Description
      description: What went wrong, and what did you expect to happen instead?
      placeholder: Clear summary of the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the issue.
      placeholder: |
        1. Open Sentient-UI
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, and Node.js version.
      placeholder: Windows 11 / Chrome 124 / Node 20.12.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console or server logs
      description: Relevant logs or terminal output if available.
      render: shell
