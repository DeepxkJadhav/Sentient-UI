name: Feature request
description: Suggest an idea or enhancement for Sentient-UI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem or limitation are you trying to address?
      placeholder: Describe the context or use case...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed change
      description: What change or feature are you suggesting?
      placeholder: Detailed description of the proposed behavior...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other solutions or workarounds you considered.
